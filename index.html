<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Snack POS - Offline</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fdf6e3">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">

<div class="container-fluid p-0">
    <div class="row g-0">
        <!-- Main Content Area -->
        <main class="col-12 col-md-8 col-lg-9 main-content position-relative">
            
            <!-- Header & Search -->
            <header class="p-3 bg-dark border-bottom border-secondary shadow-sm d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div class="d-flex justify-content-between align-items-center w-100 flex-md-grow-0" style="max-width: 250px;">
                    <h4 class="mb-0 text-white fw-bold">Snack POS</h4>
                    <a href="inventory.html" class="btn btn-sm btn-outline-light"><i class="bi bi-box-seam me-1"></i> Inventory</a>
                </div>
                <div class="input-group w-100" style="max-width: 400px;">
                    <input type="text" id="searchInput" class="form-control bg-secondary text-white border-secondary" placeholder="Search snacks...">
                    <span class="input-group-text bg-secondary text-light border-secondary"><i class="bi bi-search"></i></span>
                </div>
            </header>

            <!-- Categories -->
            <nav class="bg-dark border-bottom border-secondary p-2">
                <div class="category-nav d-flex gap-2" id="categoryContainer">
                    <button class="btn btn-primary rounded-pill category-btn active" data-category="all">All</button>
                    <button class="btn btn-outline-light rounded-pill category-btn" data-category="drinks">Drinks</button>
                    <button class="btn btn-outline-light rounded-pill category-btn" data-category="chips">Chips</button>
                    <button class="btn btn-outline-light rounded-pill category-btn" data-category="candy">Candy</button>
                </div>
            </nav>

            <!-- Product Grid -->
            <div class="product-grid-container p-3">
                <div id="productGrid" class="row row-cols-2 row-cols-sm-3 row-cols-lg-4 g-3">
                    <!-- Products will be injected here by app.js -->
                </div>
            </div>

            <!-- Mobile Cart Button -->
            <div class="d-md-none mobile-cart-btn">
                <button id="mobileCartBtn" class="btn btn-primary w-100 py-3 rounded-4 shadow d-flex justify-content-between align-items-center fs-5">
                    <span>
                        <i class="bi bi-cart3 me-2"></i>
                        <span id="mobileCartCount" class="badge bg-light text-primary rounded-pill">0</span>
                    </span>
                    <span id="mobileCartTotal">₱0.00</span>
                </button>
            </div>
        </main>

        <!-- Cart Panel -->
        <aside id="cartPanel" class="col-12 col-md-4 col-lg-3 cart-panel shadow">
            <div class="p-3 bg-dark border-bottom border-secondary d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold">Current Order</h5>
                <div>
                    <button class="btn btn-sm btn-link text-danger text-decoration-none" id="clearCartBtn">Clear</button>
                    <button class="btn btn-sm btn-dark text-light d-md-none ms-2" id="closeCartBtn"><i class="bi bi-x-lg"></i></button>
                </div>
            </div>

            <div class="cart-items-container p-2" id="cartItemsContainer">
                <div class="h-100 d-flex flex-column align-items-center justify-content-center text-secondary" id="emptyCartMessage">
                    <i class="bi bi-cart-x display-1 mb-3"></i>
                    <p class="fs-5">Your cart is empty</p>
                </div>
                <!-- Items injected by JS -->
            </div>

            <div class="p-3 bg-dark border-top border-secondary mt-auto">
                <div class="d-flex justify-content-between fs-4 fw-bold text-white mb-3">
                    <span>Total</span>
                    <span id="cartTotal">₱0.00</span>
                </div>
                <button id="checkoutBtn" class="btn btn-success w-100 py-3 fs-5 fw-bold rounded-3 shadow-sm" disabled data-bs-toggle="modal" data-bs-target="#checkoutModal">
                    Checkout
                </button>
            </div>
        </aside>
    </div>
</div>

<!-- Checkout Modal -->
<div class="modal fade" id="checkoutModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark text-light border-secondary">
      <div class="modal-header border-secondary">
        <h5 class="modal-title fw-bold">Payment</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center p-4">
        <p class="text-secondary mb-1">Amount Due</p>
        <h1 class="display-4 fw-bold text-white mb-4" id="modalTotal">₱0.00</h1>
        
        <div class="row g-3 mb-4" id="paymentMethods">
            <div class="col-6">
                <button class="btn btn-outline-secondary w-100 p-3 h-100 payment-method border-2" data-method="Cash">
                    <i class="bi bi-cash-stack display-4 text-success mb-2 d-block"></i>
                    <span class="fw-bold fs-5">Cash</span>
                </button>
            </div>
            <div class="col-6">
                <button class="btn btn-outline-secondary w-100 p-3 h-100 payment-method border-2" data-method="Digital Wallet">
                    <i class="bi bi-phone display-4 text-primary mb-2 d-block"></i>
                    <span class="fw-bold fs-5">Digital</span>
                </button>
            </div>
        </div>

        <div id="checkoutMessage" class="alert d-none mb-3"></div>

        <button id="completePaymentBtn" class="btn btn-primary w-100 py-3 fs-5 fw-bold rounded-3 shadow-sm mb-2" disabled>
            Complete Payment
        </button>
        <button id="printReceiptBtn" class="btn btn-secondary w-100 py-3 fs-5 fw-bold rounded-3 shadow-sm d-none" onclick="window.print()">
            Print Receipt
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
<script>
    // Register Service Worker for offline PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .catch(err => console.error('SW registration failed:', err));
        });
    }
</script>
</body>
</html>
